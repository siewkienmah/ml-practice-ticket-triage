name: Practice CI

# Runs the automated practice checks on every push to a fork and on every
# pull request opened back to this repository. Because contributors are
# students working from their own forks (not collaborators on this repo),
# GitHub will hold each run for a maintainer's approval before it executes -
# see INSTRUCTOR_SETUP.md to turn that on, and approve runs from the
# repository's Actions tab.

on:
  pull_request:
    branches: [main]
  push:
    branches: [practice]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the submitted commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run practice checks
        run: pytest -v

      - name: Run the pipeline end-to-end
        run: python -m src.app --data data/helpdesk_tickets.csv --output outputs/result.json

      - name: Upload your result for your own records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-result-${{ github.sha }}
          path: outputs/result.json
          if-no-files-found: warn
