name: Practice CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [practice]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the submitted commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run practice checks
        run: pytest -v

      - name: Run the pipeline end to end
        run: python -m src.app --data data/helpdesk_tickets.csv --output outputs/result.json

      - name: Upload the result for the student's records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-result-${{ github.sha }}
          path: outputs/result.json
          if-no-files-found: warn
